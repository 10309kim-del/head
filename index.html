<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sheriff Robot View</title>
<style>
  html, body { margin: 0; background: #14181c; color: #e6eaee; }
  body { font-family: "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif; min-height: 100vh;
         display: flex; flex-direction: column; align-items: center; padding: 16px; box-sizing: border-box; }
  h1 { font-size: 1.2rem; margin: 4px 0 12px; }
  canvas { width: min(100%, 860px); height: auto; background: #000; border: 2px solid #3a444f; border-radius: 4px; }
  #status { width: min(100%, 860px); margin: 10px 0 0; font-size: .9rem; color: #9aa6b2; min-height: 1.4em; }
  #status.err { color: #ff8a8a; }
  /* 숨은 video: 화면 밖에 두되 계속 재생되도록 크기를 유지 */
  video { position: absolute; left: -10000px; top: 0; width: 640px; height: 480px; }
</style>
</head>
<body>
<h1>Sheriff Robot View</h1>
<canvas id="view" width="640" height="480"></canvas>
<p id="status">시작하는 중...</p>
<video id="video" autoplay playsinline muted></video>

<script async src="https://docs.opencv.org/4.x/opencv.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.13/dist/face-api.js"></script>
<script>
// ===================== 설정 (파이썬 코드와 동일) =====================
const CASCADE_FILE = "haarcascade_frontalface_default.xml";
const CASCADE_URL  = "https://raw.githubusercontent.com/opencv/opencv/4.x/data/haarcascades/haarcascade_frontalface_default.xml";
const WARN_RATIO   = 0.35;   // 경고 기준: 얼굴 너비가 화면 너비의 35%를 넘으면
const LANDMARK_MODEL_URL = "https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.13/model/";

// 일반적인 얼굴 3D 모델 (mm, x: 오른쪽 / y: 아래 / z: 카메라 반대 방향)
// 순서: 코끝, 턱, 화면 왼쪽 눈 바깥, 화면 오른쪽 눈 바깥, 화면 왼쪽 입꼬리, 화면 오른쪽 입꼬리
const MODEL_POINTS = [
  [0, 0, 0], [0, 63.6, 12.5], [-43.3, -32.7, 26.0], [43.3, -32.7, 26.0],
  [-28.9, 28.9, 24.1], [28.9, 28.9, 24.1],
];
// 68점 랜드마크 번호: 코끝 30, 턱 8, 눈 바깥 36/45, 입꼬리 48/54
const LM_IDS = [30, 8, 36, 45, 48, 54];

// ===================== 요소 / 상태 =====================
const video  = document.getElementById("video");
const canvas = document.getElementById("view");
const ctx    = canvas.getContext("2d", { willReadFrequently: true });
const statusEl = document.getElementById("status");
let running = false, stream = null;
let classifier = null;      // OpenCV Haar 검출기
let landmarkReady = false;  // 랜드마크 모델 준비 여부
let note = "";

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
function setStatus(text, isErr) { statusEl.textContent = text; statusEl.className = isErr ? "err" : ""; }

// ===================== 자세 계산 (solvePnP 대체) =====================
function rodrigues(r) {
  const th = Math.hypot(r[0], r[1], r[2]);
  if (th < 1e-12) return [[1,0,0],[0,1,0],[0,0,1]];
  const x = r[0]/th, y = r[1]/th, z = r[2]/th;
  const c = Math.cos(th), s = Math.sin(th), t = 1 - c;
  return [
    [t*x*x + c,   t*x*y - s*z, t*x*z + s*y],
    [t*x*y + s*z, t*y*y + c,   t*y*z - s*x],
    [t*x*z - s*y, t*y*z + s*x, t*z*z + c],
  ];
}
function projectPoint(m, p, f, cx, cy) {
  const R = rodrigues([p[0], p[1], p[2]]);
  const X = R[0][0]*m[0] + R[0][1]*m[1] + R[0][2]*m[2] + p[3];
  const Y = R[1][0]*m[0] + R[1][1]*m[1] + R[1][2]*m[2] + p[4];
  const Z = Math.max(R[2][0]*m[0] + R[2][1]*m[1] + R[2][2]*m[2] + p[5], 1e-3);
  return [f * X / Z + cx, f * Y / Z + cy];
}
function residuals(p, img, f, cx, cy) {
  const out = new Array(MODEL_POINTS.length * 2);
  for (let i = 0; i < MODEL_POINTS.length; i++) {
    const q = projectPoint(MODEL_POINTS[i], p, f, cx, cy);
    out[2*i] = q[0] - img[i][0];
    out[2*i+1] = q[1] - img[i][1];
  }
  return out;
}
function solve6(A, b) {
  const n = 6, M = A.map((row, i) => [...row, b[i]]);
  for (let i = 0; i < n; i++) {
    let piv = i;
    for (let r = i + 1; r < n; r++) if (Math.abs(M[r][i]) > Math.abs(M[piv][i])) piv = r;
    if (Math.abs(M[piv][i]) < 1e-14) return null;
    [M[i], M[piv]] = [M[piv], M[i]];
    for (let r = i + 1; r < n; r++) {
      const k = M[r][i] / M[i][i];
      for (let c = i; c <= n; c++) M[r][c] -= k * M[i][c];
    }
  }
  const x = new Array(n).fill(0);
  for (let i = n - 1; i >= 0; i--) {
    let s = M[i][n];
    for (let c = i + 1; c < n; c++) s -= M[i][c] * x[c];
    x[i] = s / M[i][i];
  }
  return x;
}
const sumSq = (a) => a.reduce((s, v) => s + v * v, 0);

// cv2.solvePnP 와 같은 목적: 재투영 오차를 최소화하는 자세 [rx, ry, rz, tx, ty, tz]
function solvePose(img, W, H) {
  const f = W, cx = W / 2, cy = H / 2;
  const eyeDist = Math.hypot(img[3][0] - img[2][0], img[3][1] - img[2][1]);
  const z0 = f * 86.6 / Math.max(eyeDist, 1);
  let p = [0, 0, 0, (img[0][0] - cx) * z0 / f, (img[0][1] - cy) * z0 / f, z0];
  let r = residuals(p, img, f, cx, cy), cost = sumSq(r), lambda = 1e-2;
  for (let it = 0; it < 40; it++) {
    const J = [];
    for (let j = 0; j < 6; j++) {
      const q = p.slice(), eps = j < 3 ? 1e-6 : 1e-4;
      q[j] += eps;
      J.push(residuals(q, img, f, cx, cy).map((v, i) => (v - r[i]) / eps));
    }
    const A = Array.from({ length: 6 }, () => new Array(6).fill(0)), g = new Array(6).fill(0);
    for (let a = 0; a < 6; a++) {
      for (let b = 0; b < 6; b++) { let s = 0; for (let k = 0; k < r.length; k++) s += J[a][k] * J[b][k]; A[a][b] = s; }
      let s = 0; for (let k = 0; k < r.length; k++) s += J[a][k] * r[k]; g[a] = -s;
    }
    let improved = false;
    for (let tries = 0; tries < 8; tries++) {
      const Ad = A.map((row, i) => row.map((v, j) => (i === j ? v * (1 + lambda) + 1e-9 : v)));
      const d = solve6(Ad, g);
      if (!d) { lambda *= 10; continue; }
      const q = p.map((v, i) => v + d[i]), r2 = residuals(q, img, f, cx, cy), c2 = sumSq(r2);
      if (c2 < cost) {
        const rel = (cost - c2) / Math.max(cost, 1e-12);
        p = q; r = r2; cost = c2; lambda = Math.max(lambda / 3, 1e-7); improved = true;
        if (rel < 1e-9) it = 100;
        break;
      }
      lambda *= 4;
    }
    if (!improved) break;
  }
  return p;
}

// yaw: + 이면 화면 오른쪽으로 돌림 / pitch: + 이면 아래를 봄 / roll: + 이면 오른쪽 어깨 쪽으로 기울임
function anglesFromPose(p) {
  const R = rodrigues([p[0], p[1], p[2]]);
  const fx = -R[0][2], fy = -R[1][2], fz = -R[2][2];
  const deg = 180 / Math.PI;
  return {
    yaw:   Math.atan2(fx, -fz) * deg,
    pitch: Math.atan2(fy, Math.hypot(fx, fz)) * deg,
    roll:  Math.atan2(R[1][0], R[0][0]) * deg,
  };
}

// ===================== 화면 그리기 =====================
function drawVideoFlipped() {            // cv2.flip(img, 1)
  const W = canvas.width, H = canvas.height;
  ctx.save();
  ctx.translate(W, 0); ctx.scale(-1, 1);
  ctx.drawImage(video, 0, 0, W, H);
  ctx.restore();
}
function line(x1, y1, x2, y2, color, width) {
  ctx.strokeStyle = color; ctx.lineWidth = width;
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
}
function putText(text, x, y, color, px) {
  ctx.fillStyle = color;
  ctx.font = `700 ${px}px "Malgun Gothic", "Apple SD Gothic Neo", sans-serif`;
  ctx.textBaseline = "alphabetic";
  ctx.fillText(text, x, y);
}

async function getLandmarks(x, y, w, h) {
  // Haar가 찾은 얼굴 영역만 잘라서 68점 랜드마크를 구함 (파이썬의 facemark.fit 역할)
  const crop = document.createElement("canvas");
  crop.width = Math.max(1, Math.round(w)); crop.height = Math.max(1, Math.round(h));
  crop.getContext("2d").drawImage(canvas, x, y, w, h, 0, 0, crop.width, crop.height);
  const lm = await faceapi.nets.faceLandmark68Net.detectLandmarks(crop);
  const sx = w / crop.width, sy = h / crop.height;
  return lm.positions.map((p) => [x + p.x * sx, y + p.y * sy]);
}

async function processFrame() {
  const W = canvas.width, H = canvas.height, s = W / 640;

  // gray = cv2.cvtColor(img, cv2.COLOR_BGR2GRAY)
  const src = cv.matFromImageData(ctx.getImageData(0, 0, W, H));
  const gray = new cv.Mat();
  cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);

  // faces = face_cascade.detectMultiScale(gray, scaleFactor=1.2, minNeighbors=5, minSize=(60, 60))
  const facesVec = new cv.RectVector();
  classifier.detectMultiScale(gray, facesVec, 1.2, 5, 0, new cv.Size(60, 60), new cv.Size(0, 0));
  const faces = [];
  for (let i = 0; i < facesVec.size(); i++) { const r = facesVec.get(i); faces.push({ x: r.x, y: r.y, w: r.width, h: r.height }); }
  src.delete(); gray.delete(); facesVec.delete();

  let hud = null;
  for (const { x, y, w, h } of faces) {
    const cx = Math.floor(x + w / 2), cy = Math.floor(y + h / 2);

    // ---- 거리 경고 ----
    let color, text;
    if (w / W > WARN_RATIO) { color = "#ff0000"; text = "WARNING! TOO CLOSE!"; }
    else                    { color = "#00ff00"; text = "TARGET LOCKED"; }

    ctx.strokeStyle = color; ctx.lineWidth = 3 * s;
    ctx.strokeRect(x, y, w, h);
    line(cx - 20 * s, cy, cx + 20 * s, cy, color, 2 * s);
    line(cx, cy - 20 * s, cx, cy + 20 * s, color, 2 * s);
    const ty = y > 30 * s ? y - 10 * s : y + h + 25 * s;
    putText(text, x, ty, color, 20 * s);
    putText(`(${cx}, ${cy})`, cx + 10 * s, cy - 10 * s, color, 13 * s);

    // ---- 야/피치/롤 ----
    if (!landmarkReady) continue;
    let pts;
    try { pts = await getLandmarks(x, y, w, h); } catch (e) { console.warn(e); continue; }
    if (pts.length !== 68) continue;

    ctx.fillStyle = "#ffff00";                       // 랜드마크 점
    for (const [px, py] of pts) { ctx.beginPath(); ctx.arc(px, py, 1.5 * s, 0, Math.PI * 2); ctx.fill(); }

    const imagePoints = LM_IDS.map((k) => pts[k]);
    const pose = solvePose(imagePoints, W, H);
    const ang = anglesFromPose(pose);

    // 코끝에서 뻗는 3축 (빨강 X, 초록 Y, 파랑 Z)
    const f = W, ccx = W / 2, ccy = H / 2;
    const o = projectPoint([0, 0, 0], pose, f, ccx, ccy);
    const axes = [[[50, 0, 0], "#ff0000"], [[0, 50, 0], "#00ff00"], [[0, 0, 50], "#0000ff"]];
    for (const [v, c] of axes) {
      const e = projectPoint(v, pose, f, ccx, ccy);
      line(o[0], o[1], e[0], e[1], c, 3 * s);
    }
    hud = ang;
  }

  if (hud) {
    const f1 = (v) => v.toFixed(1).padStart(6, " ");
    putText(`Yaw  : ${f1(hud.yaw)}`,   10 * s, 30 * s, "#00ffff", 18 * s);
    putText(`Pitch: ${f1(hud.pitch)}`, 10 * s, 60 * s, "#00ffff", 18 * s);
    putText(`Roll : ${f1(hud.roll)}`,  10 * s, 90 * s, "#00ffff", 18 * s);
  }
  setStatus(`얼굴 ${faces.length}개 · ${landmarkReady ? "각도 계산 켜짐" : "각도 계산 준비 중(네모 표시는 정상)"}${note}`);
}

async function frame() {
  if (!running) return;
  drawVideoFlipped();
  if (classifier) {
    try { await processFrame(); }
    catch (e) { console.error(e); setStatus("오류: " + (e && e.message ? e.message : e), true); }
  }
  requestAnimationFrame(frame);
}

// ===================== 준비 단계 =====================
async function waitForOpenCV() {
  const t0 = performance.now();
  while (performance.now() - t0 < 120000) {
    if (typeof cv !== "undefined") {
      if (cv.Mat) return;
      if (typeof cv.then === "function" && !cv.__hooked) {   // 새 빌드: cv 가 Promise 형태
        cv.__hooked = true;
        cv.then((m) => { window.cv = m; });
      }
    }
    await sleep(200);
  }
  throw new Error("OpenCV.js를 불러오지 못했습니다 (인터넷 연결 확인)");
}

async function loadCascade() {
  const res = await fetch(CASCADE_URL);
  if (!res.ok) throw new Error("얼굴 검출기 파일을 내려받지 못했습니다");
  const data = new Uint8Array(await res.arrayBuffer());
  cv.FS_createDataFile("/", CASCADE_FILE, data, true, false, false);
  const c = new cv.CascadeClassifier();
  if (!c.load(CASCADE_FILE)) throw new Error("얼굴 검출기를 불러올 수 없습니다");
  return c;
}

async function loadLandmarkModel() {
  if (typeof faceapi === "undefined") throw new Error("face-api.js 로드 실패");
  try {
    if (faceapi.tf) {
      try { await faceapi.tf.setBackend("webgl"); } catch (_) { await faceapi.tf.setBackend("cpu"); }
      await faceapi.tf.ready();
    }
  } catch (e) { console.warn(e); }
  await faceapi.nets.faceLandmark68Net.loadFromUri(LANDMARK_MODEL_URL);
}

function stop() {
  running = false;
  if (stream) stream.getTracks().forEach((t) => t.stop());
  setStatus("카메라를 껐습니다. 다시 시작하려면 새로고침하세요.");
}
window.addEventListener("keydown", (e) => { if (e.key === "q" || e.key === "Q" || e.key === "Escape") stop(); });

async function start() {
  // 1) 카메라부터 켜서 영상이 바로 보이게 함
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    setStatus("이 환경에서는 카메라를 쓸 수 없습니다. 폴더에서 python -m http.server 8000 실행 후 http://localhost:8000 으로 여세요.", true);
    return;
  }
  try {
    setStatus("카메라 권한을 허용해 주세요.");
    stream = await navigator.mediaDevices.getUserMedia({ video: { width: { ideal: 640 }, height: { ideal: 480 } }, audio: false });
  } catch (e) {
    setStatus("카메라를 열 수 없습니다. 권한 허용 여부와 다른 프로그램의 카메라 사용 여부를 확인하세요.", true);
    return;
  }
  video.srcObject = stream;
  await video.play();
  canvas.width = video.videoWidth || 640;
  canvas.height = video.videoHeight || 480;
  running = true;
  frame();

  // 2) OpenCV.js + Haar 검출기 (파이썬 코드와 같은 방식)
  try {
    setStatus("OpenCV 불러오는 중... (처음에는 10~30초 걸릴 수 있어요)");
    await waitForOpenCV();
    setStatus("얼굴 검출기를 내려받는 중...");
    classifier = await loadCascade();
  } catch (e) {
    console.error(e);
    setStatus("오류: " + e.message, true);
    return;
  }

  // 3) 랜드마크 모델 (야/피치/롤용). 실패해도 네모 표시는 계속 동작
  try {
    await loadLandmarkModel();
    landmarkReady = true;
  } catch (e) {
    console.error(e);
    note = " · 각도 계산 모델 로드 실패";
  }
}
start();
</script>
</body>
</html>
